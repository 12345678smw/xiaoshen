<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>12格 CSS3 趣味交互盒子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px 15px;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .main {
            display: flex;
            flex-wrap: nowrap;
            justify-content: flex-start;
            gap: 16px;
            max-width: 100%;
            margin: 0 auto;
            overflow-x: auto;
            padding: 20px 10px;
        }

        .box {
            width: 100px;
            height: 100px;
            background: linear-gradient(145deg, #ff6b6b, #ee5a24);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            user-select: none;
        }

        .box span {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .box::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }

        .box:active::before {
            animation: clickWave 0.5s ease-out forwards;
        }

        @keyframes clickWave {
            0% {
                transform: scale(0.4);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        .box:active span {
            transform: scale(1.4) rotate(-10deg);
        }

        .box:nth-child(1):hover {
            transform: rotateY(360deg) scale(1.1);
            background: linear-gradient(145deg, #00d2d3, #01a3a4);
            border-radius: 50%;
        }

        .box:nth-child(2):hover {
            transform: skewX(-15deg) translateX(15px);
            background: linear-gradient(145deg, #5f27cd, #341f97);
            box-shadow: -5px 5px 20px rgba(95, 39, 205, 0.6);
        }

        .box:nth-child(3):hover {
            transform: scale(1.2) rotate(10deg);
            background: linear-gradient(145deg, #feca57, #ff9f43);
            box-shadow: 0 0 30px #feca57, 0 0 60px #ff9f43;
            color: #333;
        }

        .box:nth-child(4):hover {
            transform: translateY(-25px);
            background: linear-gradient(145deg, #48dbfb, #0abde3);
            box-shadow: 0 15px 30px rgba(72, 219, 251, 0.5);
        }

        .box:nth-child(5):hover {
            background: #2d3436;
            border: 3px solid #00b894;
            box-shadow: 0 0 0 5px rgba(0, 184, 148, 0.3),
                        0 0 20px rgba(0, 184, 148, 0.6);
            transform: scale(0.9);
        }

        .box:nth-child(6)::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #fff;
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .box:nth-child(6):hover::after {
            transform: scaleX(1);
        }

        .box:nth-child(6):hover {
            background: linear-gradient(145deg, #e17055, #d63031);
            transform: translateY(-5px);
        }

        .box:nth-child(7):hover {
            background: linear-gradient(145deg, #a29bfe, #6c5ce7);
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            0% {
                box-shadow: 0 0 0 0 rgba(162, 155, 254, 0.7);
            }
            100% {
                box-shadow: 0 0 0 25px rgba(162, 155, 254, 0);
            }
        }

        .box:nth-child(8)::before {
            content: "NEW";
            position: absolute;
            top: 8px;
            right: -30px;
            background: #ff6b6b;
            color: white;
            font-size: 11px;
            padding: 2px 30px;
            transform: rotate(45deg);
            transition: all 0.4s;
            opacity: 0;
            z-index: 2;
        }

        .box:nth-child(8):hover::before {
            opacity: 1;
            right: -25px;
        }

        .box:nth-child(8):hover {
            background: linear-gradient(145deg, #fd79a8, #e84393);
            transform: rotate(-5deg);
        }

        .box:nth-child(9) {
            overflow: hidden;
        }

        .box:nth-child(9)::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .box:nth-child(9):hover::after {
            left: 100%;
        }

        .box:nth-child(9):hover {
            background: linear-gradient(145deg, #00cec9, #00b894);
            transform: scale(1.05);
        }

        .box:nth-child(10) {
            transform-style: preserve-3d;
        }

        .box:nth-child(10):hover {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, #fdcb6e, #e17055);
        }

        .box:nth-child(10) span {
            backface-visibility: hidden;
        }

        .box:nth-child(10)::after {
            content: "背面!";
            position: absolute;
            transform: rotateY(180deg);
            backface-visibility: hidden;
            font-size: 20px;
            color: #fff;
        }

        .box:nth-child(11):hover {
            background: linear-gradient(145deg, #6c5ce7, #a29bfe);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px) rotate(-3deg); }
            40% { transform: translateX(8px) rotate(3deg); }
            60% { transform: translateX(-8px) rotate(-3deg); }
            80% { transform: translateX(8px) rotate(3deg); }
        }

        /* ========== 第12个盒子 底部hover显示名字 沈明伟 ========== */
        .box:nth-child(12) {
            position: relative;
        }
        .box:nth-child(12):hover {
            background: linear-gradient(145deg, #2d3436, #636e72);
            transform: scale(1.15);
            box-shadow: 0 0 0 3px #ffeaa7,
                        0 0 0 6px #fdcb6e,
                        0 10px 30px rgba(253, 203, 110, 0.5);
        }

        .box:nth-child(12):hover span {
            font-size: 40px;
            text-shadow: 0 0 10px #ffeaa7;
        }
        /* 名字标签，默认隐藏 */
        .box:nth-child(12) .name-tip{
            position:absolute;
            bottom:4px;
            left:0;
            width:100%;
            text-align:center;
            font-size:14px;
            color:#ffeaa7;
            opacity:0;
            transition: opacity 0.3s ease;
        }
        /* 悬浮显示名字 */
        .box:nth-child(12):hover .name-tip{
            opacity:1;
        }


        .box:nth-child(1):active {
            transform: scale(0.7) rotateY(180deg);
        }

        .box:nth-child(2):active {
            transform: scaleX(1.3) scaleY(0.7);
        }

        .box:nth-child(3):active {
            box-shadow: 0 0 40px 10px #ff9f43;
            transform: scale(1.3);
        }

        .box:nth-child(4):active {
            transform: translateY(10px);
            background: linear-gradient(145deg, #0abde3, #48dbfb);
        }

        .box:nth-child(5):active {
            transform: scale(0.7);
            border-width: 6px;
        }

        .box:nth-child(6):active {
            transform: translateY(3px);
        }

        .box:nth-child(6):active::after {
            background: #ff3838;
            transform: scaleX(0.3);
            transform-origin: right;
        }

        .box:nth-child(7):active {
            animation: doubleWave 0.6s ease-out;
        }

        @keyframes doubleWave {
            0% {
                box-shadow: 0 0 0 0 rgba(108, 92, 231, 0.8);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(108, 92, 231, 0.4);
            }
            100% {
                box-shadow: 0 0 0 30px rgba(108, 92, 231, 0);
            }
        }

        .box:nth-child(8):active::before {
            background: #fff;
            color: #e84393;
            transform: rotate(45deg) scale(1.3);
        }

        .box:nth-child(9):active::after {
            left: -100%;
            transition: left 0.2s;
        }

        .box:nth-child(10):active {
            transform: rotateY(360deg);
            transition: transform 0.25s;
        }

        .box:nth-child(11):active {
            animation: fastShake 0.4s ease-in-out;
        }

        @keyframes fastShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-12px) rotate(-5deg); }
            50% { transform: translateX(12px) rotate(5deg); }
            75% { transform: translateX(-6px) rotate(-2deg); }
        }

        .box:nth-child(12):active {
            transform: scale(0.9);
            box-shadow: 0 0 0 6px #ffeaa7,
                        0 0 0 12px #fdcb6e,
                        0 6px 20px rgba(253, 203, 110, 0.7);
        }

        .box:nth-child(12):active span {
            font-size: 28px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box"><span>1</span></div>
        <div class="box"><span>2</span></div>
        <div class="box"><span>3</span></div>
        <div class="box"><span>4</span></div>
        <div class="box"><span>5</span></div>
        <div class="box"><span>6</span></div>
        <div class="box"><span>7</span></div>
        <div class="box"><span>8</span></div>
        <div class="box"><span>9</span></div>
        <div class="box"><span>10</span></div>
        <div class="box"><span>11</span></div>
        <div class="box">
            <span>12</span>
            <div class="name-tip">沈明伟</div>
        </div>
    </div>

    <script>
        document.querySelectorAll(".box").forEach((box, index) => {
            box.addEventListener("click", function () {
                for (let i = 0; i < 6; i++) {
                    const particle = document.createElement("span");
                    particle.style.position = "absolute";
                    particle.style.width = "8px";
                    particle.style.height = "8px";
                    particle.style.borderRadius = "50%";
                    particle.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
                    particle.style.pointerEvents = "none";
                    particle.style.zIndex = "3";

                    const startX = box.offsetWidth / 2;
                    const startY = box.offsetHeight / 2;
                    particle.style.left = startX + "px";
                    particle.style.top = startY + "px";

                    box.appendChild(particle);

                    const angle = (Math.PI * 2 * i) / 6 + Math.random() * 0.6;
                    const distance = 50 + Math.random() * 40;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;

                    particle.animate([
                        {
                            transform: "translate(-50%, -50%) scale(1)",
                            opacity: 1
                        },
                        {
                            transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`,
                            opacity: 0
                        }
                    ], {
                        duration: 600,
                        easing: "ease-out"
                    }).onfinish = () => particle.remove();
                }

                const num = box.querySelector("span");
                num.animate([
                    { transform: "scale(1)" },
                    { transform: "scale(1.6)" },
                    { transform: "scale(1)" }
                ], {
                    duration: 300,
                    easing: "ease-out"
                });
            });
        });
    </script>
</body>
</html>
