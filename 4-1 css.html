    <style>
        h2,h3,p{

        #box{

        #box h3{

            /* 字间距 */

        }

        #box a{
            /* 颜色 */
            color: red;
            /* 下划线 */
            text-decoration: underline;
        }
        /* =====新增样式===== */
        /* h2黑底白字 */
