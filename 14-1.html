<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h2>沈明伟 javascript</h2>
    <script>
       //输出，沈明伟，你好，document ,alert,console三种方式
       document.write("沈明伟，你好");
       alert("沈明伟，你好");
       console.log("沈明伟，你好");
       //confirm和prompt
       confirm("沈明伟，你好");
       prompt("沈明伟，你好");
    </script>
</body>
</html>
