<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 3D小游戏 - 星际躲避</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            padding: 30px 20px;
            background: #0b0b17;
            font-family: "Microsoft YaHei", sans-serif;
            color: #fff;
        }
        h1 {
            text-align: center;
            font-size: 28px;
        }
        .shen_page_author {
            text-align: center;
            margin-top: 8px;
            margin-bottom: 24px;
            color: #feca57;
            font-size: 15px;
            letter-spacing: 2px;
        }

        .shen_game_wrap {
            max-width: 760px;
            margin: 0 auto;
        }

        .shen_hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background: #16162b;
            border: 1px solid #2a2a4a;
            border-radius: 10px 10px 0 0;
            font-size: 15px;
        }
        .shen_hud_item {
            color: rgba(255, 255, 255, 0.85);
        }
        .shen_hud_item span {
            color: #48dbfb;
            font-weight: bold;
        }
        .shen_hud_name {
            color: #feca57;
            letter-spacing: 3px;
            border: 1px solid #feca57;
            border-radius: 12px;
            padding: 2px 12px;
            font-size: 13px;
        }

        .shen_stage {
            position: relative;
        }

        .shen_scene {
            position: relative;
            width: 100%;
            height: 440px;
            overflow: hidden;
            perspective: 700px;
            perspective-origin: 50% 42%;
            background: radial-gradient(ellipse at 50% 40%, #1b2a4a 0%, #0b0b17 70%);
            border-left: 1px solid #2a2a4a;
            border-right: 1px solid #2a2a4a;
        }

        .shen_stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 40px 60px, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(2px 2px at 150px 200px, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(1.5px 1.5px at 300px 90px, rgba(255, 255, 255, 0.7), transparent),
                radial-gradient(2px 2px at 500px 260px, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(1.5px 1.5px at 620px 140px, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(2px 2px at 80px 320px, rgba(255, 255, 255, 0.4), transparent);
            background-size: 700px 400px;
        }

        .shen_ground {
            position: absolute;
            left: -30%;
            right: -30%;
            bottom: 86px;
            height: 900px;
            transform-origin: 50% 100%;
            transform: rotateX(66deg);
            background:
                linear-gradient(to bottom, rgba(11, 11, 23, 1) 0%, rgba(11, 11, 23, 0) 40%),
                repeating-linear-gradient(to bottom, transparent 0 56px, rgba(72, 219, 251, 0.55) 56px 60px),
                linear-gradient(to bottom, #171734 0%, #101024 100%);
            background-size: 100% 100%, 100% 60px, 100% 100%;
            background-position: 0 0, 0 0, 0 0;
        }
        .shen_lane_mark {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0));
        }
        .shen_lane_mark_l2 { left: calc(50% - 180px); }
        .shen_lane_mark_l1 { left: calc(50% - 60px); }
        .shen_lane_mark_r1 { left: calc(50% + 60px); }
        .shen_lane_mark_r2 { left: calc(50% + 180px); }

        .shen_obs_world {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
        }
        .shen_obs {
            position: absolute;
            left: 50%;
            bottom: 80px;
            width: 90px;
            height: 90px;
            margin-left: -45px;
            background: linear-gradient(135deg, #ff6b6b, #c0392b);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            box-shadow: 0 0 24px rgba(255, 107, 107, 0.7);
        }

        .shen_player {
            position: absolute;
            left: 50%;
            bottom: 80px;
            width: 90px;
            height: 90px;
            margin-left: -45px;
            transition: transform 0.15s ease-out;
        }
        .shen_player_body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #48dbfb, #1e90ff);
            border-radius: 14px;
            box-shadow: 0 0 30px rgba(72, 219, 251, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            color: #062032;
            letter-spacing: 2px;
        }

        .shen_overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 15, 0.82);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            text-align: center;
            padding: 20px;
        }
        .shen_overlay_hidden {
            display: none;
        }
        .shen_overlay h2 {
            font-size: 30px;
            color: #48dbfb;
        }
        .shen_overlay p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }
        .shen_overlay_name {
            color: #feca57;
            letter-spacing: 3px;
            border: 1px solid #feca57;
            border-radius: 14px;
            padding: 4px 16px;
            font-size: 14px;
        }

        .shen_flash {
            position: absolute;
            inset: 0;
            background: rgba(255, 80, 80, 0.45);
            opacity: 0;
            pointer-events: none;
            z-index: 30;
        }
        .shen_flash_on {
            animation: shen_flash_anim 0.4s ease-out;
        }
        @keyframes shen_flash_anim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .shen_btn {
            padding: 10px 26px;
            border: none;
            border-radius: 8px;
            background: #48dbfb;
            color: #0b0b17;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .shen_btn:hover {
            background: #1dd1a1;
        }
        .shen_btn:active {
            transform: scale(0.95);
        }

        .shen_controls {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 16px;
            background: #16162b;
            border: 1px solid #2a2a4a;
            border-top: none;
            border-radius: 0 0 10px 10px;
        }

        .shen_tips {
            max-width: 760px;
            margin: 20px auto 0;
            padding: 14px 20px;
            background: #16162b;
            border: 1px solid #2a2a4a;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.75);
        }
        .shen_tips strong {
            color: #48dbfb;
        }
        .shen_tips_footer {
            margin-top: 8px;
            color: #feca57;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <h1>CSS3 3D 小游戏：星际躲避</h1>
    <p class="shen_page_author">演示人：沈明伟</p>

    <div class="shen_game_wrap">
        <div class="shen_hud">
            <span class="shen_hud_item">得分：<span id="shen_score">0</span></span>
            <span class="shen_hud_item">速度：<span id="shen_speed_text">1.0x</span></span>
            <span class="shen_hud_name">沈明伟</span>
        </div>

        <div class="shen_stage">
            <div class="shen_scene" id="shen_scene">
                <div class="shen_stars"></div>
                <div class="shen_ground" id="shen_ground">
                    <div class="shen_lane_mark shen_lane_mark_l2"></div>
                    <div class="shen_lane_mark shen_lane_mark_l1"></div>
                    <div class="shen_lane_mark shen_lane_mark_r1"></div>
                    <div class="shen_lane_mark shen_lane_mark_r2"></div>
                </div>
                <div class="shen_obs_world" id="shen_obs_world"></div>
                <div class="shen_player" id="shen_player">
                    <div class="shen_player_body">沈明伟</div>
                </div>
            </div>

            <div class="shen_overlay" id="shen_start_overlay">
                <h2>星际躲避</h2>
                <p>驾驶飞船在星际轨道上穿梭<br>使用 ← → 方向键或点击下方按钮在三条车道间移动<br>避开红色障碍物，坚持越久分数越高！</p>
                <button class="shen_btn" id="shen_btn_start">开始游戏</button>
                <p class="shen_overlay_name">作者：沈明伟</p>
            </div>

            <div class="shen_overlay shen_overlay_hidden" id="shen_over_overlay">
                <h2>游戏结束</h2>
                <p>最终得分：<span id="shen_final_score">0</span></p>
                <button class="shen_btn" id="shen_btn_restart">重新开始</button>
                <p class="shen_overlay_name">作者：沈明伟</p>
            </div>

            <div class="shen_flash" id="shen_flash"></div>
        </div>

        <div class="shen_controls">
            <button class="shen_btn" id="shen_btn_left">← 左移</button>
            <button class="shen_btn" id="shen_btn_right">右移 →</button>
        </div>

        <div class="shen_tips">
            <strong>操作说明：</strong>← / → 方向键或 A / D 移动，空格键或回车键开始 / 重新开始游戏。<br>
            速度会随存活时间不断加快，小心应对！
            <p class="shen_tips_footer">CSS3 3D 小游戏 · 沈明伟</p>
        </div>
    </div>

    <script>
        var shen_scene = document.getElementById('shen_scene');
        var shen_ground = document.getElementById('shen_ground');
        var shen_player = document.getElementById('shen_player');
        var shen_obs_world = document.getElementById('shen_obs_world');
        var shen_score_el = document.getElementById('shen_score');
        var shen_speed_text = document.getElementById('shen_speed_text');
        var shen_start_overlay = document.getElementById('shen_start_overlay');
        var shen_over_overlay = document.getElementById('shen_over_overlay');
        var shen_final_score = document.getElementById('shen_final_score');
        var shen_flash = document.getElementById('shen_flash');

        var shen_LANES = [-120, 0, 120];
        var shen_BASE_SPEED = 420;
        var shen_MAX_SPEED = 1500;
        var shen_OBS_FAR = -1500;
        var shen_OBS_END = 260;

        var shen_lane_index = 1;
        var shen_state = 'ready';
        var shen_score = 0;
        var shen_speed = shen_BASE_SPEED;
        var shen_elapsed = 0;
        var shen_floor_offset = 0;
        var shen_obs_list = [];
        var shen_spawn_timer = 0;
        var shen_last_time = 0;

        function shen_render_player() {
            shen_player.style.transform = 'translate3d(' + shen_LANES[shen_lane_index] + 'px, 0, 0)';
        }

        function shen_move_left() {
            if (shen_state !== 'running') return;
            if (shen_lane_index > 0) {
                shen_lane_index--;
                shen_render_player();
            }
        }

        function shen_move_right() {
            if (shen_state !== 'running') return;
            if (shen_lane_index < shen_LANES.length - 1) {
                shen_lane_index++;
                shen_render_player();
            }
        }

        function shen_spawn_obs() {
            var shen_obs_count = Math.random() < 0.35 ? 2 : 1;
            var shen_lanes_left = [0, 1, 2];
            for (var i = 0; i < shen_obs_count; i++) {
                var shen_idx = Math.floor(Math.random() * shen_lanes_left.length);
                var shen_lane = shen_lanes_left.splice(shen_idx, 1)[0];
                var shen_el = document.createElement('div');
                shen_el.className = 'shen_obs';
                shen_obs_world.appendChild(shen_el);
                shen_obs_list.push({ el: shen_el, lane: shen_lane, z: shen_OBS_FAR });
            }
        }

        function shen_clear_obs() {
            for (var i = 0; i < shen_obs_list.length; i++) {
                shen_obs_list[i].el.remove();
            }
            shen_obs_list = [];
        }

        function shen_start_game() {
            shen_clear_obs();
            shen_lane_index = 1;
            shen_render_player();
            shen_score = 0;
            shen_elapsed = 0;
            shen_speed = shen_BASE_SPEED;
            shen_spawn_timer = 0.6;
            shen_state = 'running';
            shen_score_el.textContent = '0';
            shen_speed_text.textContent = '1.0x';
            shen_start_overlay.classList.add('shen_overlay_hidden');
            shen_over_overlay.classList.add('shen_overlay_hidden');
        }

        function shen_game_over() {
            shen_state = 'over';
            shen_final_score.textContent = Math.floor(shen_score);
            shen_over_overlay.classList.remove('shen_overlay_hidden');
            shen_flash.classList.remove('shen_flash_on');
            void shen_flash.offsetWidth;
            shen_flash.classList.add('shen_flash_on');
        }

        function shen_game_loop(shen_time) {
            if (!shen_last_time) shen_last_time = shen_time;
            var shen_dt = (shen_time - shen_last_time) / 1000;
            shen_last_time = shen_time;
            if (shen_dt > 0.05) shen_dt = 0.05;

            if (shen_state === 'running') {
                shen_elapsed += shen_dt;
                shen_speed = Math.min(shen_BASE_SPEED + shen_elapsed * 36, shen_MAX_SPEED);
                shen_score += shen_dt * (shen_speed / 10);
                shen_floor_offset = (shen_floor_offset + shen_speed * shen_dt) % 60;
                shen_ground.style.backgroundPosition = '0 0, 0 ' + shen_floor_offset + 'px, 0 0';

                shen_spawn_timer -= shen_dt;
                if (shen_spawn_timer <= 0) {
                    shen_spawn_obs();
                    shen_spawn_timer = Math.max(1.1 - shen_elapsed / 60, 0.45);
                }

                for (var i = shen_obs_list.length - 1; i >= 0; i--) {
                    var shen_obs = shen_obs_list[i];
                    shen_obs.z += shen_speed * shen_dt;
                    shen_obs.el.style.transform = 'translate3d(' + shen_LANES[shen_obs.lane] + 'px, 0, ' + shen_obs.z + 'px)';
                    if (shen_obs.lane === shen_lane_index && shen_obs.z > -110 && shen_obs.z < 150) {
                        shen_game_over();
                        break;
                    }
                    if (shen_obs.z >= shen_OBS_END) {
                        shen_obs.el.remove();
                        shen_obs_list.splice(i, 1);
                    }
                }

                shen_score_el.textContent = Math.floor(shen_score);
                shen_speed_text.textContent = (shen_speed / shen_BASE_SPEED).toFixed(1) + 'x';
            }

            requestAnimationFrame(shen_game_loop);
        }

        document.getElementById('shen_btn_start').onclick = shen_start_game;
        document.getElementById('shen_btn_restart').onclick = shen_start_game;
        document.getElementById('shen_btn_left').onclick = shen_move_left;
        document.getElementById('shen_btn_right').onclick = shen_move_right;

        document.addEventListener('keydown', function (shen_event) {
            if (shen_event.key === 'ArrowLeft' || shen_event.key === 'a' || shen_event.key === 'A') {
                shen_move_left();
            } else if (shen_event.key === 'ArrowRight' || shen_event.key === 'd' || shen_event.key === 'D') {
                shen_move_right();
            } else if (shen_event.key === ' ' || shen_event.key === 'Enter') {
                if (shen_state !== 'running') shen_start_game();
            }
        });

        shen_render_player();
        requestAnimationFrame(shen_game_loop);
    </script>
</body>
</html>
