<!DOCTYPE html>
<!-- 姓名：沈明伟，日期：2026-10-15，功能名称：CSS3 3D小游戏：星际躲避 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 3D小游戏 - 星际躲避</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            padding: 30px 20px;
            background: #0b0b17;
            font-family: "Microsoft YaHei", sans-serif;
            color: #fff;
        }
        h1 {
            text-align: center;
            font-size: 28px;
        }
        .smw_page_author {
            text-align: center;
            margin-top: 8px;
            margin-bottom: 24px;
            color: #feca57;
            font-size: 15px;
            letter-spacing: 2px;
        }

        .smw_game_wrap {
            max-width: 760px;
            margin: 0 auto;
        }

        .smw_hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background: #16162b;
            border: 1px solid #2a2a4a;
            border-radius: 10px 10px 0 0;
            font-size: 15px;
        }
        .smw_hud_item {
            color: rgba(255, 255, 255, 0.85);
        }
        .smw_hud_item span {
            color: #48dbfb;
            font-weight: bold;
        }
        .smw_hud_name {
            color: #feca57;
            letter-spacing: 3px;
            border: 1px solid #feca57;
            border-radius: 12px;
            padding: 2px 12px;
            font-size: 13px;
        }

        .smw_stage {
            position: relative;
        }

        .smw_scene {
            position: relative;
            width: 100%;
            height: 440px;
            overflow: hidden;
            perspective: 700px;
            perspective-origin: 50% 42%;
            background: radial-gradient(ellipse at 50% 40%, #1b2a4a 0%, #0b0b17 70%);
            border-left: 1px solid #2a2a4a;
            border-right: 1px solid #2a2a4a;
        }

        .smw_stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 40px 60px, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(2px 2px at 150px 200px, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(1.5px 1.5px at 300px 90px, rgba(255, 255, 255, 0.7), transparent),
                radial-gradient(2px 2px at 500px 260px, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(1.5px 1.5px at 620px 140px, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(2px 2px at 80px 320px, rgba(255, 255, 255, 0.4), transparent);
            background-size: 700px 400px;
        }

        .smw_ground {
            position: absolute;
            left: -30%;
            right: -30%;
            bottom: 86px;
            height: 900px;
            transform-origin: 50% 100%;
            transform: rotateX(66deg);
            background:
                linear-gradient(to bottom, rgba(11, 11, 23, 1) 0%, rgba(11, 11, 23, 0) 40%),
                repeating-linear-gradient(to bottom, transparent 0 56px, rgba(72, 219, 251, 0.55) 56px 60px),
                linear-gradient(to bottom, #171734 0%, #101024 100%);
            background-size: 100% 100%, 100% 60px, 100% 100%;
            background-position: 0 0, 0 0, 0 0;
        }
        .smw_lane_mark {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0));
        }
        .smw_lane_mark_l2 { left: calc(50% - 180px); }
        .smw_lane_mark_l1 { left: calc(50% - 60px); }
        .smw_lane_mark_r1 { left: calc(50% + 60px); }
        .smw_lane_mark_r2 { left: calc(50% + 180px); }

        .smw_obs_world {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
        }
        .smw_obs {
            position: absolute;
            left: 50%;
            bottom: 80px;
            width: 90px;
            height: 90px;
            margin-left: -45px;
            background: linear-gradient(135deg, #ff6b6b, #c0392b);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            box-shadow: 0 0 24px rgba(255, 107, 107, 0.7);
        }

        .smw_player {
            position: absolute;
            left: 50%;
            bottom: 80px;
            width: 90px;
            height: 90px;
            margin-left: -45px;
            transition: transform 0.15s ease-out;
        }
        .smw_player_body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #48dbfb, #1e90ff);
            border-radius: 14px;
            box-shadow: 0 0 30px rgba(72, 219, 251, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            color: #062032;
            letter-spacing: 2px;
        }

        .smw_overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 15, 0.82);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            text-align: center;
            padding: 20px;
        }
        .smw_overlay_hidden {
            display: none;
        }
        .smw_overlay h2 {
            font-size: 30px;
            color: #48dbfb;
        }
        .smw_overlay p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }
        .smw_overlay_name {
            color: #feca57;
            letter-spacing: 3px;
            border: 1px solid #feca57;
            border-radius: 14px;
            padding: 4px 16px;
            font-size: 14px;
        }

        .smw_flash {
            position: absolute;
            inset: 0;
            background: rgba(255, 80, 80, 0.45);
            opacity: 0;
            pointer-events: none;
            z-index: 30;
        }
        .smw_flash_on {
            animation: smw_flash_anim 0.4s ease-out;
        }
        @keyframes smw_flash_anim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .smw_btn {
            padding: 10px 26px;
            border: none;
            border-radius: 8px;
            background: #48dbfb;
            color: #0b0b17;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .smw_btn:hover {
            background: #1dd1a1;
        }
        .smw_btn:active {
            transform: scale(0.95);
        }

        .smw_controls {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 16px;
            background: #16162b;
            border: 1px solid #2a2a4a;
            border-top: none;
            border-radius: 0 0 10px 10px;
        }

        .smw_tips {
            max-width: 760px;
            margin: 20px auto 0;
            padding: 14px 20px;
            background: #16162b;
            border: 1px solid #2a2a4a;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.75);
        }
        .smw_tips strong {
            color: #48dbfb;
        }
        .smw_tips_footer {
            margin-top: 8px;
            color: #feca57;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <h1>CSS3 3D 小游戏：星际躲避</h1>
    <p class="smw_page_author">演示人：沈明伟</p>

    <div class="smw_game_wrap">
        <div class="smw_hud">
            <span class="smw_hud_item">得分：<span id="smw_score">0</span></span>
            <span class="smw_hud_item">速度：<span id="smw_speed_text">1.0x</span></span>
            <span class="smw_hud_name">沈明伟</span>
        </div>

        <div class="smw_stage">
            <div class="smw_scene" id="smw_scene">
                <div class="smw_stars"></div>
                <div class="smw_ground" id="smw_ground">
                    <div class="smw_lane_mark smw_lane_mark_l2"></div>
                    <div class="smw_lane_mark smw_lane_mark_l1"></div>
                    <div class="smw_lane_mark smw_lane_mark_r1"></div>
                    <div class="smw_lane_mark smw_lane_mark_r2"></div>
                </div>
                <div class="smw_obs_world" id="smw_obs_world"></div>
                <div class="smw_player" id="smw_player">
                    <div class="smw_player_body">沈明伟</div>
                </div>
            </div>

            <div class="smw_overlay" id="smw_start_overlay">
                <h2>星际躲避</h2>
                <p>驾驶飞船在星际轨道上穿梭<br>使用 ← → 方向键或点击下方按钮在三条车道间移动<br>避开红色障碍物，坚持越久分数越高！</p>
                <button class="smw_btn" id="smw_btn_start">开始游戏</button>
                <p class="smw_overlay_name">作者：沈明伟</p>
            </div>

            <div class="smw_overlay smw_overlay_hidden" id="smw_over_overlay">
                <h2>游戏结束</h2>
                <p>最终得分：<span id="smw_final_score">0</span></p>
                <button class="smw_btn" id="smw_btn_restart">重新开始</button>
                <p class="smw_overlay_name">作者：沈明伟</p>
            </div>

            <div class="smw_flash" id="smw_flash"></div>
        </div>

        <div class="smw_controls">
            <button class="smw_btn" id="smw_btn_left">← 左移</button>
            <button class="smw_btn" id="smw_btn_right">右移 →</button>
        </div>

        <div class="smw_tips">
            <strong>操作说明：</strong>← / → 方向键或 A / D 移动，空格键或回车键开始 / 重新开始游戏。<br>
            速度会随存活时间不断加快，小心应对！
            <p class="smw_tips_footer">CSS3 3D 小游戏 · 沈明伟</p>
        </div>
    </div>

    <script>
        var smw_scene = document.getElementById('smw_scene');
        var smw_ground = document.getElementById('smw_ground');
        var smw_player = document.getElementById('smw_player');
        var smw_obs_world = document.getElementById('smw_obs_world');
        var smw_score_el = document.getElementById('smw_score');
        var smw_speed_text = document.getElementById('smw_speed_text');
        var smw_start_overlay = document.getElementById('smw_start_overlay');
        var smw_over_overlay = document.getElementById('smw_over_overlay');
        var smw_final_score = document.getElementById('smw_final_score');
        var smw_flash = document.getElementById('smw_flash');

        var smw_LANES = [-120, 0, 120];
        var smw_BASE_SPEED = 420;
        var smw_MAX_SPEED = 1500;
        var smw_OBS_FAR = -1500;
        var smw_OBS_END = 260;

        var smw_lane_index = 1;
        var smw_state = 'ready';
        var smw_score = 0;
        var smw_speed = smw_BASE_SPEED;
        var smw_elapsed = 0;
        var smw_floor_offset = 0;
        var smw_obs_list = [];
        var smw_spawn_timer = 0;
        var smw_last_time = 0;

        function smw_render_player() {
            smw_player.style.transform = 'translate3d(' + smw_LANES[smw_lane_index] + 'px, 0, 0)';
        }

        function smw_move_left() {
            if (smw_state !== 'running') return;
            if (smw_lane_index > 0) {
                smw_lane_index--;
                smw_render_player();
            }
        }

        function smw_move_right() {
            if (smw_state !== 'running') return;
            if (smw_lane_index < smw_LANES.length - 1) {
                smw_lane_index++;
                smw_render_player();
            }
        }

        function smw_spawn_obs() {
            var smw_obs_count = Math.random() < 0.35 ? 2 : 1;
            var smw_lanes_left = [0, 1, 2];
            for (var i = 0; i < smw_obs_count; i++) {
                var smw_idx = Math.floor(Math.random() * smw_lanes_left.length);
                var smw_lane = smw_lanes_left.splice(smw_idx, 1)[0];
                var smw_el = document.createElement('div');
                smw_el.className = 'smw_obs';
                smw_obs_world.appendChild(smw_el);
                smw_obs_list.push({ el: smw_el, lane: smw_lane, z: smw_OBS_FAR });
            }
        }

        function smw_clear_obs() {
            for (var i = 0; i < smw_obs_list.length; i++) {
                smw_obs_list[i].el.remove();
            }
            smw_obs_list = [];
        }

        function smw_start_game() {
            smw_clear_obs();
            smw_lane_index = 1;
            smw_render_player();
            smw_score = 0;
            smw_elapsed = 0;
            smw_speed = smw_BASE_SPEED;
            smw_spawn_timer = 0.6;
            smw_state = 'running';
            smw_score_el.textContent = '0';
            smw_speed_text.textContent = '1.0x';
            smw_start_overlay.classList.add('smw_overlay_hidden');
            smw_over_overlay.classList.add('smw_overlay_hidden');
        }

        function smw_game_over() {
            smw_state = 'over';
            smw_final_score.textContent = Math.floor(smw_score);
            smw_over_overlay.classList.remove('smw_overlay_hidden');
            smw_flash.classList.remove('smw_flash_on');
            void smw_flash.offsetWidth;
            smw_flash.classList.add('smw_flash_on');
        }

        function smw_game_loop(smw_time) {
            if (!smw_last_time) smw_last_time = smw_time;
            var smw_dt = (smw_time - smw_last_time) / 1000;
            smw_last_time = smw_time;
            if (smw_dt > 0.05) smw_dt = 0.05;

            if (smw_state === 'running') {
                smw_elapsed += smw_dt;
                smw_speed = Math.min(smw_BASE_SPEED + smw_elapsed * 36, smw_MAX_SPEED);
                smw_score += smw_dt * (smw_speed / 10);
                smw_floor_offset = (smw_floor_offset + smw_speed * smw_dt) % 60;
                smw_ground.style.backgroundPosition = '0 0, 0 ' + smw_floor_offset + 'px, 0 0';

                smw_spawn_timer -= smw_dt;
                if (smw_spawn_timer <= 0) {
                    smw_spawn_obs();
                    smw_spawn_timer = Math.max(1.1 - smw_elapsed / 60, 0.45);
                }

                for (var i = smw_obs_list.length - 1; i >= 0; i--) {
                    var smw_obs = smw_obs_list[i];
                    smw_obs.z += smw_speed * smw_dt;
                    smw_obs.el.style.transform = 'translate3d(' + smw_LANES[smw_obs.lane] + 'px, 0, ' + smw_obs.z + 'px)';
                    if (smw_obs.lane === smw_lane_index && smw_obs.z > -110 && smw_obs.z < 150) {
                        smw_game_over();
                        break;
                    }
                    if (smw_obs.z >= smw_OBS_END) {
                        smw_obs.el.remove();
                        smw_obs_list.splice(i, 1);
                    }
                }

                smw_score_el.textContent = Math.floor(smw_score);
                smw_speed_text.textContent = (smw_speed / smw_BASE_SPEED).toFixed(1) + 'x';
            }

            requestAnimationFrame(smw_game_loop);
        }

        document.getElementById('smw_btn_start').onclick = smw_start_game;
        document.getElementById('smw_btn_restart').onclick = smw_start_game;
        document.getElementById('smw_btn_left').onclick = smw_move_left;
        document.getElementById('smw_btn_right').onclick = smw_move_right;

        document.addEventListener('keydown', function (smw_event) {
            if (smw_event.key === 'ArrowLeft' || smw_event.key === 'a' || smw_event.key === 'A') {
                smw_move_left();
            } else if (smw_event.key === 'ArrowRight' || smw_event.key === 'd' || smw_event.key === 'D') {
                smw_move_right();
            } else if (smw_event.key === ' ' || smw_event.key === 'Enter') {
                if (smw_state !== 'running') smw_start_game();
            }
        });

        smw_render_player();
        requestAnimationFrame(smw_game_loop);
    </script>
</body>
</html>
